name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    # The native helper is IOKit-only, so building it needs macOS; the JS halves
    # are platform independent and are checked everywhere.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check index.js
      - run: node --check client.js
